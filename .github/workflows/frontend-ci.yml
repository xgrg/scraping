name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './app/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run format -- --check || true

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Check coverage threshold
      run: |
        if [ -f coverage/coverage-final.json ]; then
          node -e "
          const cov = require('./coverage/coverage-final.json');
          let totalLines = 0, coveredLines = 0;
          for (let file in cov) {
            const lines = cov[file].lines;
            for (let line in lines) {
              totalLines++;
              if (lines[line] > 0) coveredLines++;
            }
          }
          const percentage = (coveredLines / totalLines * 100).toFixed(2);
          console.log('Coverage:', percentage + '%');
          if (percentage < 80) {
            console.error('Coverage ' + percentage + '% is below 80% threshold');
            process.exit(1);
          }
          "
        fi

    - name: Build application
      run: npm run build

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./app/coverage/coverage-final.json
        flags: frontend
        name: codecov-frontend
        fail_ci_if_error: false

    - name: Archive coverage report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: frontend-coverage
        path: app/coverage
